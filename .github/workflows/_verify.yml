name: Verification implementation
on:
  workflow_call:
    inputs:
      from-source:
        description: Ignore the bundled project cache and elaborate all project sources
        type: boolean
        default: false
      kernel-replay:
        description: Replay the complete imported proof closure with the pinned kernel
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Reserve memory for full kernel replay
        run: |
          # These SDKs are unused on this disposable proof-verification runner.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo fallocate -l 16G /mnt/symplectic-swap
          sudo chmod 600 /mnt/symplectic-swap
          sudo mkswap /mnt/symplectic-swap
          sudo swapon /mnt/symplectic-swap
          free -h
          df -h .
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            ~/.cache/Tectonic
            .lake/packages
          key: ${{ runner.os }}-lean-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-tectonic-0.15.0
      - name: Install pinned Elan and Lean toolchain
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -fL --retry 3 https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
            echo '42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  /tmp/elan.tar.gz' | sha256sum -c -
            tar -xzf /tmp/elan.tar.gz -C /tmp
            /tmp/elan-init -y --default-toolchain none --no-modify-path
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Install pinned Tectonic
        run: |
          curl -fL --retry 3 https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/tectonic-0.15.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/tectonic.tar.gz
          echo 'dfb82876f2986862996e564fa507a9e576e0c1e3bee63c2c1bd677c2543e6407  /tmp/tectonic.tar.gz' | sha256sum -c -
          tar -xzf /tmp/tectonic.tar.gz -C /tmp
          sudo install /tmp/tectonic /usr/local/bin/tectonic
          tectonic --version
      - name: Obtain official Mathlib dependency cache
        run: lake exe cache get
      - name: Restore matching project cache
        id: project-cache
        if: ${{ !inputs.from-source }}
        run: |
          status=0
          python3 scripts/project_cache.py restore || status=$?
          if [ "$status" = 2 ]; then
            echo 'Project sources changed: rebuilding from source.'
            echo 'route=source' >> "$GITHUB_OUTPUT"
          elif [ "$status" != 0 ]; then
            exit "$status"
          else
            echo 'route=restored' >> "$GITHUB_OUTPUT"
          fi
      - name: Build sources, audits, regressions, and papers
        run: bash scripts/verify.sh
      - name: Replay all proof dependencies in a fresh kernel
        if: ${{ inputs.from-source || inputs.kernel-replay }}
        run: bash scripts/check_kernel.sh
      - name: Record verification route
        if: success()
        env:
          FROM_SOURCE: ${{ inputs.from-source }}
          KERNEL_REPLAY: ${{ inputs.from-source || inputs.kernel-replay }}
          CACHE_ROUTE: ${{ inputs.from-source && 'source' || steps.project-cache.outputs.route }}
        run: |
          {
            echo '## Symplectic Ball Packing'
            echo "Commit: $GITHUB_SHA"
            echo "Project source rebuild requested: $FROM_SOURCE"
            echo "Actual project-cache route: $CACHE_ROUTE"
            echo 'Source hygiene, Lean targets, axiom/explicitness/independence gates, regression suites, and both papers: PASS.'
            if [ "$KERNEL_REPLAY" = true ]; then
              echo 'Fresh kernel replay: PASS.'
            else
              echo 'Fresh kernel replay: not requested; use the kernel-replay workflow for this stronger check.'
            fi
            echo 'Download the PDFs and logs from the verification artifact below.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve papers and verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: symplectic-ball-packing-${{ inputs.from-source && 'source' || 'cached' }}-${{ github.sha }}
          path: |
            paper/build/main.pdf
            paper/build/supplement.pdf
            .lake/verify/*.log
            .lake/verify/*.json
            cache/lean/manifest.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
